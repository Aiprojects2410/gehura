<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Graphic Era Hill University | ERP | Cyborg-ERP</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    
    <!-- Fast reliable CDNs -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" type="text/css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style type="text/css">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100vh !important;
            height: 100% !important;
            font-family: 'Open Sans', Arial, Helvetica, sans-serif;
            background-color: #0b1528 !important;
            overflow-x: hidden;
        }

        body.theme-blue-gradient {
            background: url('bg.jpg') no-repeat center bottom fixed !important;
            background-size: cover !important;
            width: 100% !important;
            min-height: 100vh !important;
            position: relative;
        }

        #login-full-wrapper {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 28px 45px 25px 20px;
        }

        .login-card-container {
            width: 100%;
            max-width: 295px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
            border-radius: 3px;
            overflow: hidden;
        }

        /* Top White Logo Box */
        .login-header-box {
            background: #ffffff;
            padding: 10px 14px 8px;
            text-align: center;
        }

        .login-header-box img {
            max-width: 100%;
            max-height: 56px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Translucent Dark Form Body */
        .login-body-box {
            background: rgba(48, 75, 98, 0.74);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 16px 16px 14px;
        }

        /* Input Groups */
        .custom-input-group {
            position: relative;
            display: flex;
            width: 100%;
            height: 35px;
            margin-bottom: 9px;
        }

        .custom-addon {
            background: #253443;
            width: 36px;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            font-size: 13.5px;
            border-radius: 2px 0 0 2px;
            border: none;
        }

        .custom-input {
            background: #ffffff !important;
            border: none !important;
            border-radius: 0 2px 2px 0 !important;
            color: #222222 !important;
            font-size: 12.5px !important;
            font-weight: 500 !important;
            height: 35px !important;
            padding: 4px 10px !important;
            width: calc(100% - 36px) !important;
            box-shadow: none !important;
            outline: none !important;
        }

        .custom-input::placeholder {
            color: #8e8e8e;
            font-weight: 400;
        }

        .custom-input:focus {
            background: #ffffff !important;
            outline: none !important;
            box-shadow: inset 0 0 0 1px #00a0e9 !important;
        }

        /* Password Eye Icon */
        #eyes {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            cursor: pointer;
            color: #222222;
            padding: 3px;
            font-size: 13.5px;
        }
        #eyes:hover {
            color: #000000;
        }

        /* Captcha Display Row */
        .captcha-row {
            display: flex;
            width: 100%;
            height: 38px;
            margin-bottom: 9px;
        }

        .captcha-refresh-addon {
            background: #253443;
            width: 36px;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 2px 0 0 2px;
            transition: background 0.15s;
        }

        .captcha-refresh-addon:hover {
            background: #1c2834;
        }

        .captcha-refresh-addon i {
            color: #2ecc71;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.25s ease;
        }

        .captcha-refresh-addon:hover i {
            transform: rotate(180deg);
        }

        .captcha-canvas-wrap {
            background: #ffffff;
            width: calc(100% - 36px);
            height: 38px;
            border-radius: 0 2px 2px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #captchaCanvas {
            width: 100%;
            height: 38px;
            display: block;
        }

        /* Captcha Input Box */
        .captcha-input-wrap {
            width: 100%;
            height: 35px;
            margin-bottom: 10px;
        }

        .captcha-full-input {
            background: #ffffff !important;
            border: none !important;
            border-radius: 2px !important;
            color: #222222 !important;
            font-size: 12.5px !important;
            font-weight: 500 !important;
            height: 35px !important;
            padding: 4px 10px !important;
            width: 100% !important;
            text-align: center !important;
            outline: none !important;
        }

        .captcha-full-input::placeholder {
            color: #8e8e8e;
            font-weight: 400;
        }

        .captcha-full-input:focus {
            background: #ffffff !important;
            outline: none !important;
            box-shadow: inset 0 0 0 1px #00a0e9 !important;
        }

        /* Solid Sky Blue Login Button */
        .btn-login-submit {
            background: #00a0e9 !important;
            border: none !important;
            border-radius: 2px !important;
            color: #ffffff !important;
            font-size: 12.5px !important;
            font-weight: 700 !important;
            letter-spacing: 0.8px !important;
            height: 35px !important;
            width: 100% !important;
            cursor: pointer !important;
            text-transform: uppercase !important;
            box-shadow: none !important;
            transition: background-color 0.15s ease !important;
        }

        .btn-login-submit:hover {
            background: #008ece !important;
        }

        .btn-login-submit:active {
            background: #007bb3 !important;
        }

        /* Forgot Links */
        .forgot-links-section {
            margin-top: 8px;
            text-align: right;
        }

        .forgot-links-section a {
            color: #ffffff !important;
            font-size: 11.5px !important;
            text-decoration: none !important;
            display: block;
            line-height: 1.5;
            font-weight: 400;
            opacity: 0.95;
            transition: opacity 0.15s, color 0.15s;
        }

        .forgot-links-section a:hover {
            color: #cce7ff !important;
            text-decoration: underline !important;
            opacity: 1;
        }

        /* Footer Text */
        .login-footer-section {
            margin-top: 18px;
            padding-top: 9px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            text-align: center;
        }

        .login-footer-section p {
            color: rgba(255, 255, 255, 0.88);
            font-size: 10px;
            margin: 0;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* Error Text */
        .err-text {
            color: #ff9999;
            font-size: 10.5px;
            font-weight: 600;
            display: block;
            margin-top: -6px;
            margin-bottom: 5px;
            min-height: 12px;
        }

        /* Hide Netlify Drawer & Badge */
        [data-netlify-drawer], #netlify-badge, .netlify-badge, netlify-drawer, iframe[src*="netlify"], div[class*="netlify-drawer"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            #login-full-wrapper {
                align-items: center;
                justify-content: center;
                padding: 20px 15px;
            }
            .login-card-container {
                max-width: 300px;
            }
        }
    </style>
</head>

<body class="theme-blue-gradient">
<div id="login-full-wrapper">
    <div class="login-card-container">
        
        <!-- Header Logo Box -->
        <div class="login-header-box">
            <img src="gehu_logo_perfect.png" alt="Graphic Era Hill University" id="imgclient"/>
        </div>

        <!-- Translucent Dark Form Body -->
        <div class="login-body-box">
            <form id="login-form" method="post" name="login" onsubmit="return handleLogin(event)">
                
                <!-- Username Input -->
                <div class="custom-input-group">
                    <span class="custom-addon"><i class="fa fa-user"></i></span>
                    <input autocomplete="off" class="custom-input" id="loginform-username" name="username" placeholder="User ID" type="text" value=""/>
                </div>
                <span class="err-text" id="userError"></span>

                <!-- Password Input -->
                <div class="custom-input-group">
                    <span class="custom-addon"><i class="fa fa-key"></i></span>
                    <input autocomplete="off" class="custom-input" id="loginform-password" name="password" placeholder="Password" type="password" value=""/>
                    <span id="eyes"><i class="fa fa-eye-slash" aria-hidden="true"></i></span>
                </div>
                <span class="err-text" id="passError"></span>

                <!-- Captcha Row with Green Refresh Icon & Overlapping Bubble Captcha -->
                <div class="captcha-row">
                    <div class="captcha-refresh-addon" id="btnRefreshCaptcha" title="Click to refresh captcha">
                        <i class="fa fa-refresh"></i>
                    </div>
                    <div class="captcha-canvas-wrap">
                        <canvas id="captchaCanvas" width="260" height="38"></canvas>
                    </div>
                </div>

                <!-- Captcha Input -->
                <div class="captcha-input-wrap">
                    <input autocomplete="off" class="captcha-full-input" id="captcha" name="captcha" placeholder="Enter Captcha" type="text" value=""/>
                </div>
                <span class="err-text" id="captchaError"></span>

                <!-- Solid Sky Blue Login Button -->
                <button type="submit" class="btn-login-submit" name="login" onclick="return handleLogin(event)">LOGIN</button>

                <!-- Forgot Links -->
                <div class="forgot-links-section">
                    <a href="#" onclick="alert('Please contact Examination Cell / Registrar Office for Password Reset.'); return false;">Forgot password ?</a>
                    <a href="#" onclick="alert('Please check your Admission slip or Marksheet for Enrollment ID.'); return false;">Forgot ID ?</a>
                </div>

                <!-- Powered by Footer -->
                <div class="login-footer-section">
                    <p>Powered by Cyborg IT Services (P) Ltd.</p>
                </div>
            </form>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
    // ========== EXACT OVERLAPPING BUBBLE CAPTCHA SYSTEM ==========
    var currentCaptcha = '';

    function generateCaptchaText() {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var text = '';
        for (var i = 0; i < 6; i++) {
            text += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return text;
    }

    function drawCaptcha() {
        var canvas = document.getElementById('captchaCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        currentCaptcha = generateCaptchaText();

        var cw = canvas.width;
        var ch = canvas.height;

        // Clear background to white
        ctx.clearRect(0, 0, cw, ch);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);

        // Draw overlapping translucent colored pills/ellipses matching original Cyborg captcha:
        var bubbles = [
            { x: cw * 0.16, y: ch * 0.5, rx: cw * 0.28, ry: ch * 0.44, color: 'rgba(255, 110, 110, 0.55)' },
            { x: cw * 0.36, y: ch * 0.5, rx: cw * 0.28, ry: ch * 0.44, color: 'rgba(130, 225, 130, 0.55)' },
            { x: cw * 0.56, y: ch * 0.5, rx: cw * 0.28, ry: ch * 0.44, color: 'rgba(90, 165, 230, 0.55)' },
            { x: cw * 0.76, y: ch * 0.5, rx: cw * 0.28, ry: ch * 0.44, color: 'rgba(180, 150, 240, 0.55)' }
        ];

        for (var b = 0; b < bubbles.length; b++) {
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(bubbles[b].x, bubbles[b].y, bubbles[b].rx, bubbles[b].ry, 0, 0, 2 * Math.PI);
            ctx.fillStyle = bubbles[b].color;
            ctx.fill();
            ctx.restore();
        }

        // Draw clean bold black alphanumeric captcha text centered
        ctx.save();
        ctx.font = 'bold 21px "Arial", "Lucida Console", sans-serif';
        ctx.fillStyle = '#111111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(currentCaptcha, cw / 2, ch / 2);
        ctx.restore();
    }

    // ========== EYE TOGGLE ==========
    $(function() {
        $('#eyes').click(function() {
            if ($('#eyes i').hasClass('fa-eye-slash')) {
                $('#loginform-password').attr('type', 'text');
                $('#eyes i').addClass('fa-eye').removeClass('fa-eye-slash');
            } else {
                $('#loginform-password').attr('type', 'password');
                $('#eyes i').removeClass('fa-eye').addClass('fa-eye-slash');
            }
        });

        // Refresh captcha button
        $('#btnRefreshCaptcha').click(function() {
            drawCaptcha();
            $('#captcha').val('');
            $('#captchaError').text('');
        });

        // Init captcha
        drawCaptcha();

        // Clear errors on input
        $('#loginform-username').on('input', function() { $('#userError').text(''); });
        $('#loginform-password').on('input', function() { $('#passError').text(''); });
        $('#captcha').on('input', function() { $('#captchaError').text(''); });
    });

    // ========== SYNCHRONOUS INSTANT MULTI-STUDENT LOGIN HANDLER ==========
    function handleLogin(e) {
        if (e) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
        }
        var rawUserId = ($('#loginform-username').val() || '').trim();
        var password = ($('#loginform-password').val() || '').trim();

        // Clear previous errors
        $('#userError').text('');
        $('#passError').text('');
        $('#captchaError').text('');

        // 1. Admin check
        var uClean = (rawUserId || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        if (uClean === 'admin' || rawUserId.toLowerCase() === 'graphicera261@gmail.com') {
            sessionStorage.setItem('adminLoggedIn', 'true');
            sessionStorage.setItem('adminEmail', 'graphicera261@gmail.com');
            window.location.href = 'admin.html';
            return false;
        }

        // 2. Select matching Student (Mohd Sohil vs Mohd Hashim vs dynamic)
        var targetStudent = DEFAULT_STUDENT; // Default to Mohd Hashim

        var isSohil = (
            uClean === 'ge21538540' ||
            uClean === '21538540' ||
            uClean === '2187530' ||
            uClean.includes('sohil') ||
            rawUserId.toLowerCase().includes('sohil') ||
            rawUserId.toLowerCase().includes('8630003510')
        );

        if (isSohil) {
            targetStudent = SOHIL_STUDENT;
        } else {
            // Check dynamic students list if registered in local storage
            try {
                var localList = JSON.parse(localStorage.getItem('ge_students') || '[]');
                var dyn = localList.find(function(s) {
                    var sClean = (s.enroll_no || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    var rClean = (s.class_roll_no || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    return sClean === uClean || rClean === uClean;
                });
                if (dyn) targetStudent = dyn;
            } catch(err) {}
        }

        // 3. Student Profile Set
        sessionStorage.setItem('loggedIn', 'true');
        sessionStorage.setItem('userId', targetStudent.enroll_no);
        sessionStorage.setItem('userName', targetStudent.name);
        sessionStorage.setItem('email', targetStudent.email || '');
        sessionStorage.setItem('phone', targetStudent.phone || '');
        sessionStorage.setItem('fatherName', targetStudent.father_name || '');
        sessionStorage.setItem('motherName', targetStudent.mother_name || '');
        sessionStorage.setItem('dob', targetStudent.dob || '');
        sessionStorage.setItem('officialEmail', targetStudent.official_email || targetStudent.email || '');
        sessionStorage.setItem('course', targetStudent.course || 'B.COM (Hons)');
        sessionStorage.setItem('classRollNo', targetStudent.class_roll_no || '');
        sessionStorage.setItem('enrollNo', targetStudent.enroll_no);
        sessionStorage.setItem('photo', targetStudent.photo || 'candidate_photo_hd.png?v=20260824');

        // Instant redirect
        window.location.href = 'dashboard.html';
        return false;
    }
</script>
</body>
</html>
