<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Graphic Era Hill University | ERP | Cyborg-ERP</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    
    <!-- Reliable Fast Cloudflare CDN Links -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,300" rel="stylesheet" type="text/css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style type="text/css">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100vh !important;
            font-family: 'Open Sans', Arial, Helvetica, sans-serif;
            background-color: #0b1528 !important;
        }

        body.theme-blue-gradient {
            background: url('bg.jpg') no-repeat center center fixed !important;
            background-size: cover !important;
            width: 100% !important;
            min-height: 100vh !important;
            position: relative;
        }

        #login-full-wrapper {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 40px 60px 40px 20px;
        }

        .login-box-container {
            width: 100%;
            max-width: 380px;
            margin-right: 40px;
        }

        #login-header {
            text-align: center;
            margin-bottom: 14px;
        }

        #login-logo {
            display: inline-block;
            background: #ffffff;
            padding: 8px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.35);
        }

        #imgclient {
            max-height: 58px;
            max-width: 100%;
            height: auto;
            display: block;
        }

        #login-box-inner {
            background: rgba(30, 41, 59, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 24px 22px 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        .input-group {
            position: relative;
            display: flex;
            width: 100%;
            margin-bottom: 12px;
        }

        .input-group-addon {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-right: none;
            color: #38bdf8;
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 6px 0 0 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0 6px 6px 0;
            color: #0f172a;
            font-size: 13.5px;
            font-weight: 600;
            height: 42px;
            padding: 8px 12px;
            width: 100%;
            box-shadow: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: #0090e3;
            box-shadow: 0 0 0 3px rgba(0, 144, 227, 0.3);
            outline: none;
        }

        .form-control::placeholder {
            color: #64748b;
            font-weight: 500;
        }

        #eyes {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            cursor: pointer;
            color: #64748b;
            padding: 4px;
        }
        #eyes:hover {
            color: #0f172a;
        }

        .captcha-box-wrapper {
            background: #ffffff;
            border-radius: 6px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #captchaCanvas {
            width: 250px;
            height: 40px;
            display: block;
            border-radius: 4px;
        }

        #btnRefreshCaptcha {
            color: #16a34a;
            cursor: pointer;
            padding: 6px 10px;
            font-size: 18px;
            transition: transform 0.2s;
        }
        #btnRefreshCaptcha:hover {
            transform: rotate(90deg);
        }

        #captcha {
            border-radius: 6px;
            text-align: center;
            letter-spacing: 2px;
            font-size: 15px;
            font-weight: 700;
        }

        .btnSubmit.loginbtn {
            background: linear-gradient(135deg, #0090e3 0%, #0284c7 100%);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            height: 44px;
            width: 100%;
            margin-top: 4px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 144, 227, 0.4);
            transition: all 0.2s ease;
        }
        .btnSubmit.loginbtn:hover {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 6px 18px rgba(0, 144, 227, 0.55);
            transform: translateY(-1px);
        }

        .err-text {
            color: #f87171;
            font-size: 11.5px;
            font-weight: 600;
            display: block;
            margin-top: -8px;
            margin-bottom: 8px;
            min-height: 16px;
        }

        .forgot-links-row {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .forgot-links-row a {
            color: #e0f2fe;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.15s;
        }
        .forgot-links-row a:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        /* Hide Netlify Drawer & Badge */
        [data-netlify-drawer], #netlify-badge, .netlify-badge, netlify-drawer, iframe[src*="netlify"], div[class*="netlify-drawer"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Responsive */
        @media (max-width: 992px) {
            #login-full-wrapper {
                justify-content: center;
                padding: 20px 15px;
            }
            .login-box-container {
                margin-right: 0;
                max-width: 360px;
            }
        }
    </style>
</head>

<body class="theme-blue-gradient">
<div id="login-full-wrapper">
    <div class="login-box-container">
        <!-- Logo -->
        <header id="login-header">
            <div id="login-logo">
                <img id="imgclient" src="logo.png" alt="Graphic Era (Deemed to be University)"/>
            </div>
        </header>

        <!-- Glass Form Card -->
        <div id="login-box-inner">
            <form id="login-form" method="post" name="login" onsubmit="return handleLogin(event)">
                <!-- Username Input -->
                <div class="input-group">
                    <span class="input-group-addon"><i class="fa fa-user"></i></span>
                    <input autocomplete="off" class="form-control" id="loginform-username" name="username" placeholder="Admission / User ID" type="text" value=""/>
                </div>
                <span class="err-text" id="userError"></span>

                <!-- Password Input -->
                <div class="input-group">
                    <span class="input-group-addon"><i class="fa fa-key"></i></span>
                    <input autocomplete="off" class="form-control" id="loginform-password" name="password" placeholder="Password" type="password" value=""/>
                    <span id="eyes"><i class="fa fa-eye-slash" aria-hidden="true"></i></span>
                </div>
                <span class="err-text" id="passError"></span>

                <!-- Captcha Display Box -->
                <div class="captcha-box-wrapper">
                    <canvas id="captchaCanvas" width="250" height="40"></canvas>
                    <i title="Click to refresh captcha" class="fa fa-refresh" id="btnRefreshCaptcha"></i>
                </div>

                <!-- Captcha Input -->
                <div class="input-group">
                    <input autocomplete="off" class="form-control" id="captcha" name="captcha" placeholder="Enter Captcha" type="text" value=""/>
                </div>
                <span class="err-text" id="captchaError"></span>

                <!-- Login Button -->
                <button type="submit" class="btnSubmit loginbtn" name="login" onclick="return handleLogin(event)">LOGIN</button>

                <!-- Forgot Links -->
                <div class="forgot-links-row">
                    <a href="#" id="login-forget-link" onclick="alert('Please contact Examination Cell / Registrar Office for Password Reset.'); return false;">Forgot password ?</a>
                    <a href="#" onclick="alert('Please check your Admission slip or Marksheet for Enrollment ID.'); return false;">Forgot ID ?</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
    // ========== CAPTCHA SYSTEM ==========
    var currentCaptcha = '';

    function generateCaptchaText() {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var text = '';
        for (var i = 0; i < 6; i++) {
            text += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return text;
    }

    function drawCaptcha() {
        var canvas = document.getElementById('captchaCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        currentCaptcha = generateCaptchaText();

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background
        var gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
        gradient.addColorStop(0, '#f1f5f9');
        gradient.addColorStop(0.5, '#e2e8f0');
        gradient.addColorStop(1, '#f1f5f9');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Noise lines
        for (var i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.strokeStyle = 'rgba(' + Math.floor(Math.random()*150) + ',' + Math.floor(Math.random()*150) + ',' + Math.floor(Math.random()*150) + ',0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Captcha text
        var colors = ['#dc2626', '#0284c7', '#16a34a', '#9333ea', '#ea580c', '#0891b2'];
        var fonts = ['Arial', 'Verdana', 'Georgia', 'Helvetica'];
        var x = 24;
        for (var i = 0; i < currentCaptcha.length; i++) {
            ctx.save();
            ctx.font = 'bold ' + (21 + Math.random() * 6) + 'px ' + fonts[Math.floor(Math.random() * fonts.length)];
            ctx.fillStyle = colors[i % colors.length];
            ctx.translate(x, 26 + (Math.random() * 6 - 3));
            ctx.rotate((Math.random() - 0.5) * 0.35);
            ctx.fillText(currentCaptcha[i], 0, 0);
            ctx.restore();
            x += 35;
        }

        // Noise dots
        for (var i = 0; i < 30; i++) {
            ctx.beginPath();
            ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.fill();
        }
    }

    // ========== EYE TOGGLE ==========
    $(function() {
        $('#eyes').click(function() {
            if ($('#eyes i').hasClass('fa-eye-slash')) {
                $('#loginform-password').attr('type', 'text');
                $('#eyes i').addClass('fa-eye').removeClass('fa-eye-slash');
            } else {
                $('#loginform-password').attr('type', 'password');
                $('#eyes i').removeClass('fa-eye').addClass('fa-eye-slash');
            }
        });

        // Refresh captcha button
        $('#btnRefreshCaptcha').click(function() {
            drawCaptcha();
            $('#captcha').val('');
            $('#captchaError').text('');
        });

        // Init captcha
        drawCaptcha();

        // Clear errors on input
        $('#loginform-username').on('input', function() { $('#userError').text(''); });
        $('#loginform-password').on('input', function() { $('#passError').text(''); });
        $('#captcha').on('input', function() { $('#captchaError').text(''); });
    });

    // ========== SYNCHRONOUS INSTANT MULTI-STUDENT LOGIN HANDLER ==========
    function handleLogin(e) {
        if (e) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
        }
        var rawUserId = ($('#loginform-username').val() || '').trim();
        var password = ($('#loginform-password').val() || '').trim();

        // Clear previous errors
        $('#userError').text('');
        $('#passError').text('');
        $('#captchaError').text('');

        // 1. Admin check
        var uClean = (rawUserId || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        if (uClean === 'admin' || rawUserId.toLowerCase() === 'graphicera261@gmail.com') {
            sessionStorage.setItem('adminLoggedIn', 'true');
            sessionStorage.setItem('adminEmail', 'graphicera261@gmail.com');
            window.location.href = 'admin.html';
            return false;
        }

        // 2. Select matching Student (Mohd Sohil vs Mohd Hashim vs dynamic)
        var targetStudent = DEFAULT_STUDENT; // Default to Mohd Hashim

        var isSohil = (
            uClean === 'ge21538540' ||
            uClean === '21538540' ||
            uClean === '2187530' ||
            uClean.includes('sohil') ||
            rawUserId.toLowerCase().includes('sohil') ||
            rawUserId.toLowerCase().includes('8630003510')
        );

        if (isSohil) {
            targetStudent = SOHIL_STUDENT;
        } else {
            // Check dynamic students list if registered in local storage
            try {
                var localList = JSON.parse(localStorage.getItem('ge_students') || '[]');
                var dyn = localList.find(function(s) {
                    var sClean = (s.enroll_no || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    var rClean = (s.class_roll_no || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    return sClean === uClean || rClean === uClean;
                });
                if (dyn) targetStudent = dyn;
            } catch(err) {}
        }

        // 3. Student Profile Set
        sessionStorage.setItem('loggedIn', 'true');
        sessionStorage.setItem('userId', targetStudent.enroll_no);
        sessionStorage.setItem('userName', targetStudent.name);
        sessionStorage.setItem('email', targetStudent.email || '');
        sessionStorage.setItem('phone', targetStudent.phone || '');
        sessionStorage.setItem('fatherName', targetStudent.father_name || '');
        sessionStorage.setItem('motherName', targetStudent.mother_name || '');
        sessionStorage.setItem('dob', targetStudent.dob || '');
        sessionStorage.setItem('officialEmail', targetStudent.official_email || targetStudent.email || '');
        sessionStorage.setItem('course', targetStudent.course || 'B.COM (Hons)');
        sessionStorage.setItem('classRollNo', targetStudent.class_roll_no || '');
        sessionStorage.setItem('enrollNo', targetStudent.enroll_no);
        sessionStorage.setItem('photo', targetStudent.photo || 'candidate_photo_hd.png?v=20260824');

        // Instant redirect
        window.location.href = 'dashboard.html';
        return false;
    }
</script>
</body>
</html>
