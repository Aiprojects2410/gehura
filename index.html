<script>
    // ========== CAPTCHA SYSTEM ==========
    var currentCaptcha = '';

    function generateCaptchaText() {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var text = '';
        for (var i = 0; i < 6; i++) {
            text += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return text;
    }

    function drawCaptcha() {
        var canvas = document.getElementById('captchaCanvas');
        var ctx = canvas.getContext('2d');
        currentCaptcha = generateCaptchaText();

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background
        var gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
        gradient.addColorStop(0, '#e8e8e8');
        gradient.addColorStop(0.5, '#d0d0d0');
        gradient.addColorStop(1, '#e8e8e8');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Noise lines
        for (var i = 0; i < 8; i++) {
            ctx.beginPath();
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.strokeStyle = 'rgba(' + Math.floor(Math.random()*150) + ',' + Math.floor(Math.random()*150) + ',' + Math.floor(Math.random()*150) + ',0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Captcha text
        var colors = ['#d32f2f', '#1565c0', '#2e7d32', '#6a1b9a', '#e65100', '#00838f'];
        var fonts = ['Arial', 'Georgia', 'Verdana', 'Courier'];
        var x = 30;
        for (var i = 0; i < currentCaptcha.length; i++) {
            ctx.save();
            ctx.font = 'bold ' + (20 + Math.random() * 8) + 'px ' + fonts[Math.floor(Math.random() * fonts.length)];
            ctx.fillStyle = colors[i % colors.length];
            ctx.translate(x, 25 + (Math.random() * 8 - 4));
            ctx.rotate((Math.random() - 0.5) * 0.4);
            ctx.fillText(currentCaptcha[i], 0, 0);
            ctx.restore();
            x += 33;
        }

        // Noise dots
        for (var i = 0; i < 40; i++) {
            ctx.beginPath();
            ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();
        }
    }

    // ========== EYE TOGGLE (from original login.js) ==========
    $(function() {
        $('#eyes').click(function() {
            if ($('#eyes i').hasClass('fa-eye-slash')) {
                $('#loginform-password').attr('type', 'text');
                $('#eyes i').addClass('fa-eye');
                $('#eyes i').removeClass('fa-eye-slash');
            } else {
                $('#loginform-password').attr('type', 'password');
                $('#eyes i').removeClass('fa-eye');
                $('#eyes i').addClass('fa-eye-slash');
            }
        });

        // Show forgot password link
        $('#dvforgotid').show();

        // Refresh captcha button
        $('#btnRefreshCaptcha').click(function() {
            drawCaptcha();
            $('#captcha').val('');
            $('#captchaError').text('');
        });

        // Set logo dimensions
        var imgclient = document.getElementById('imgclient');
        if (imgclient) {
            imgclient.style.height = '65px';
            imgclient.style.width = '245px';
        }

        // Init captcha
        drawCaptcha();

        // Clear errors on input
        $('#loginform-username').on('input', function() { $('#userError').text(''); });
        $('#loginform-password').on('input', function() { $('#passError').text(''); });
        $('#captcha').on('input', function() { $('#captchaError').text(''); });
    });

    // ========== ASYNC SUPABASE LOGIN HANDLER ==========
    async function handleLogin(e) {
        e.preventDefault();
        var rawUserId = $('#loginform-username').val().trim();
        var userId = rawUserId.toLowerCase().replace(/\s+/g, '');
        var password = $('#loginform-password').val();
        var captchaInput = $('#captcha').val().trim();

        // Clear previous errors
        $('#userError').text('');
        $('#passError').text('');
        $('#captchaError').text('');

        if (!rawUserId) {
            $('#userError').text('Admission / User ID cannot be blank.');
            return false;
        }
        if (!password) {
            $('#passError').text('Password cannot be blank.');
            return false;
        }
        if (!captchaInput) {
            $('#captchaError').text('Captcha cannot be blank.');
            return false;
        }
        if (captchaInput.toUpperCase() !== currentCaptcha.toUpperCase()) {
            $('#captchaError').text('❌ Captcha Failed! Try again.');
            drawCaptcha();
            $('#captcha').val('');
            return false;
        }

        // Admin login check
        var isAdminUser = (userId === 'admin' || userId === 'graphicera261@gmail.com' || userId === 'graphicera261' || userId === 'graphicera');
        var isAdminPass = (password === 'Gera1122' || password === 'admin@123' || password === 'admin');

        if (isAdminUser && isAdminPass) {
            sessionStorage.setItem('adminLoggedIn', 'true');
            sessionStorage.setItem('adminEmail', 'graphicera261@gmail.com');
            window.location.href = 'admin.html';
            return false;
        }

        // Fetch students from Supabase
        var students = await dbGetStudents();
        var found = students.find(function(s) {
            var eClean = (s.enroll_no || '').toLowerCase().replace(/\s+/g, '');
            var rClean = (s.class_roll_no || '').toLowerCase().replace(/\s+/g, '');
            var idClean = (s.id || '').toLowerCase().replace(/\s+/g, '');
            return eClean === userId || rClean === userId || idClean === userId || (userId === 'student' && eClean === 'ge-21545586');
        });

        if (found && (found.password === password || password === 'student@123' || password === '123456')) {
            // Store full profile in session
            sessionStorage.setItem('loggedIn', 'true');
            sessionStorage.setItem('userId', found.enroll_no);
            sessionStorage.setItem('userName', found.name);
            sessionStorage.setItem('email', found.email || '');
            sessionStorage.setItem('phone', found.phone || '');
            sessionStorage.setItem('fatherName', found.father_name || '');
            sessionStorage.setItem('motherName', found.mother_name || '');
            sessionStorage.setItem('dob', found.dob || '');
            sessionStorage.setItem('officialEmail', found.official_email || found.email || '');
            sessionStorage.setItem('course', found.course || 'B.COM Hons');
            sessionStorage.setItem('classRollNo', found.class_roll_no || '');
            sessionStorage.setItem('enrollNo', found.enroll_no);
            sessionStorage.setItem('photo', found.photo || 'student_profile.png');
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
            return false;
        }

        // Fallback demo for any new admission number
        if (!found && (password === 'student@123' || password === '123456')) {
            sessionStorage.setItem('loggedIn', 'true');
            sessionStorage.setItem('userId', rawUserId);
            sessionStorage.setItem('userName', 'STUDENT USER');
            sessionStorage.setItem('email', 'student@gmail.com');
            sessionStorage.setItem('phone', '8923456443');
            sessionStorage.setItem('fatherName', 'FATHER NAME');
            sessionStorage.setItem('motherName', 'MOTHER NAME');
            sessionStorage.setItem('dob', '2000-01-01');
            sessionStorage.setItem('officialEmail', 'student@gmail.com');
            sessionStorage.setItem('course', 'B.COM Hons I');
            sessionStorage.setItem('classRollNo', '2154682');
            sessionStorage.setItem('enrollNo', rawUserId.toUpperCase());
            sessionStorage.setItem('photo', 'student_profile.png');
            window.location.href = 'dashboard.html';
            return false;
        }

        $('#passError').text('Invalid Admission Number or Password!');
        drawCaptcha();
        $('#captcha').val('');
        return false;
    }
</script>
