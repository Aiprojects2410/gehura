<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Era Hill University - Statement of Grades</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #2d3748;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0 40px;
            min-height: 100vh;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Hide Netlify Drawer & Badge */
        [data-netlify-drawer], #netlify-badge, .netlify-badge, netlify-drawer, iframe[src*="netlify"], div[class*="netlify-drawer"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Top Action Bar / Controls */
        .action-bar {
            width: 210mm;
            max-width: 96vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 16px;
            background: #1a202c;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-bar a, .action-bar button, .sem-btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .action-bar a:hover, .action-bar button:hover, .sem-btn:hover {
            background-color: #0369a1;
            color: #ffffff;
        }

        .sem-selector-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .sem-btn.active {
            background-color: #16a34a !important;
            font-weight: 700;
            box-shadow: 0 0 0 2px #ffffff;
        }

        /* A4 Container Display */
        .document-viewer-container {
            width: 210mm;
            max-width: 96vw;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 2px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .authentic-grade-card-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Print Rules */
        @media print {
            body {
                background: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .action-bar {
                display: none !important;
            }
            .document-viewer-container {
                width: 100% !important;
                max-width: 100% !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .authentic-grade-card-img {
                width: 100% !important;
                height: 100% !important;
                max-height: 297mm !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- Action Bar & Semester Selection -->
    <div class="action-bar">
        <div style="display:flex; align-items:center; gap:8px;">
            <a href="view_results.html">&larr; Results List</a>
            <span style="font-weight:bold; font-size:13px; color:#e2e8f0;">Select Semester:</span>
        </div>
        
        <div class="sem-selector-group">
            <button class="sem-btn" onclick="switchSemester(1)" id="btnSem1">Sem I</button>
            <button class="sem-btn" onclick="switchSemester(2)" id="btnSem2">Sem II</button>
            <button class="sem-btn" onclick="switchSemester(3)" id="btnSem3">Sem III</button>
            <button class="sem-btn" onclick="switchSemester(4)" id="btnSem4">Sem IV</button>
            <button class="sem-btn" onclick="switchSemester(5)" id="btnSem5">Sem V</button>
            <button class="sem-btn" onclick="switchSemester(6)" id="btnSem6">Sem VI</button>
        </div>

        <div style="display:flex; gap:8px;">
            <a id="downloadPdfBtn" href="sohil_sem1.pdf" download="Statement_of_Grades.pdf" style="background:#4b5563;">📥 Download PDF</a>
            <button onclick="window.print()" style="background:#16a34a;">🖨️ Print / Save</button>
        </div>
    </div>

    <!-- Authentic Document Viewer -->
    <div class="document-viewer-container">
        <img id="gradeCardImg" src="sohil_grade_card_sem1.png" alt="Statement of Grades" class="authentic-grade-card-img"/>
    </div>

    <script>
        var sohilImages = {
            '1': 'sohil_grade_card_sem1.png',
            '2': 'sohil_grade_card_sem2.png',
            '3': 'sohil_grade_card_sem3.png',
            '4': 'sohil_grade_card_sem4.png',
            '5': 'sohil_grade_card_sem5.png',
            '6': 'sohil_grade_card_sem6.png'
        };

        var sohilPdfs = {
            '1': 'sohil_sem1.pdf',
            '2': 'sohil_sem2.pdf',
            '3': 'sohil_sem3.pdf',
            '4': 'sohil_sem4.pdf',
            '5': 'sohil_sem5.pdf',
            '6': 'sohil_sem6.pdf'
        };

        function switchSemester(semNum) {
            var urlParams = new URLSearchParams(window.location.search);
            var studentId = urlParams.get('id') || sessionStorage.getItem('enrollNo') || 'GE-21538540';
            var newUrl = window.location.pathname + '?sem=' + semNum + '&id=' + encodeURIComponent(studentId);
            window.history.replaceState({ path: newUrl }, '', newUrl);
            renderDocument();
        }

        function renderDocument() {
            var urlParams = new URLSearchParams(window.location.search);
            var sem = urlParams.get('sem') || '1';
            var studentId = urlParams.get('id') || sessionStorage.getItem('enrollNo') || 'GE-21538540';

            // Highlight Active Tab
            for (var s = 1; s <= 6; s++) {
                var btn = document.getElementById('btnSem' + s);
                if (btn) {
                    if ("" + s === ("" + sem)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            }

            // Set authentic image
            var imgElem = document.getElementById('gradeCardImg');
            var downloadBtn = document.getElementById('downloadPdfBtn');
            var imgSrc = sohilImages[sem] || 'sohil_grade_card_sem1.png';
            var pdfSrc = sohilPdfs[sem] || 'sohil_sem1.pdf';

            imgElem.src = imgSrc;
            if (downloadBtn) {
                downloadBtn.href = pdfSrc;
                downloadBtn.download = `Statement_of_Grades_Sem_${sem}.pdf`;
            }
        }

        window.addEventListener('DOMContentLoaded', renderDocument);
    </script>
</body>
</html>
