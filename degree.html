<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Era Hill University | Original Degree Certificate - MOHD SOHIL</title>
    <link href="https://student.gehu.ac.in/css/bootstrap/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="qrcode.min.js"></script>
    <script>
        // Synchronous Student Detection
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var queryId = urlParams.get('id') || '';
            var sessEnroll = sessionStorage.getItem('enrollNo') || '';
            var sessName = sessionStorage.getItem('userName') || '';
            var checkId = (queryId + ' ' + sessEnroll + ' ' + sessName).toLowerCase().replace(/[^a-z0-9]/g, '');
            var isHashim = (
                checkId.includes('ge21545586') ||
                checkId.includes('21545586') ||
                checkId.includes('2154682') ||
                checkId.includes('hashim')
            );
            window._isSohil = !isHashim;
            window._activeStudent = window._isSohil ? SOHIL_STUDENT : DEFAULT_STUDENT;
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b303a;
            color: #111111;
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            padding: 20px 0 50px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Top Action / Navigation Bar */
        .action-bar {
            width: 210mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            z-index: 100;
        }
        .action-bar-left, .action-bar-right {
            display: flex;
            gap: 10px;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: none;
            transition: all 0.2s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .btn-back {
            background-color: #1e293b;
            color: #ffffff;
        }
        .btn-back:hover {
            background-color: #0f172a;
            color: #ffffff;
            text-decoration: none;
        }
        .btn-print {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #ffffff;
            font-weight: 800;
        }
        .btn-print:hover {
            background: linear-gradient(135deg, #b45309, #d97706);
            color: #ffffff;
            transform: translateY(-1px);
        }
        .btn-verify {
            background-color: #0284c7;
            color: #ffffff;
        }
        .btn-verify:hover {
            background-color: #0369a1;
            color: #ffffff;
            text-decoration: none;
        }

        /* ===== DEGREE CERTIFICATE CONTAINER (A4 DIMENSIONS) ===== */
        .degree-sheet {
            width: 210mm;
            height: 297mm;
            position: relative;
            background-color: #fffdf7;
            background-image: url('gehu_degree_clean_base.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.15);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* ===== ACCURATE OVERLAY FIELD POSITIONING ===== */
        /* 1. Top Meta Values */
        .overlay-meta-serial {
            position: absolute;
            top: 6.70%;
            left: 15.93%;
            transform: translateX(-50%);
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 12.5px;
            font-weight: 400;
            color: #1a1a1a;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .overlay-meta-enroll {
            position: absolute;
            top: 6.70%;
            left: 50.02%;
            transform: translateX(-50%);
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 12.5px;
            font-weight: 400;
            color: #1a1a1a;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .overlay-meta-roll {
            position: absolute;
            top: 6.70%;
            left: 81.89%;
            transform: translateX(-50%);
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 12.5px;
            font-weight: 400;
            color: #1a1a1a;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        /* 2. Scannable Verification QR Code */
        .overlay-qr-box {
            position: absolute;
            top: 10.50%;
            left: 14.04%;
            width: 8.23%;
            height: 5.82%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            overflow: hidden;
        }
        .overlay-qr-box canvas, .overlay-qr-box img {
            width: 100% !important;
            height: 100% !important;
            display: block;
            image-rendering: pixelated;
        }

        /* 3. Candidate Photograph */
        .overlay-photo-box {
            position: absolute;
            top: 13.36%;
            left: 75.96%;
            width: 7.26%;
            height: 6.82%;
            overflow: hidden;
            background: #ffffff;
        }
        .overlay-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 4. Hindi Name */
        .overlay-hindi-name {
            position: absolute;
            top: 32.30%;
            left: 51.46%;
            transform: translateX(-50%);
            font-family: 'Noto Serif Devanagari', 'Mangal', 'Kokila', serif;
            font-size: 23px;
            font-weight: 700;
            color: #991b1b; /* Authentic Graphic Era Red */
            white-space: nowrap;
            letter-spacing: 0.3px;
            text-align: center;
        }

        /* 5. Hindi CGPA */
        .overlay-hindi-cgpa {
            position: absolute;
            top: 41.95%;
            left: 45.40%;
            font-family: 'Noto Serif Devanagari', 'Mangal', 'Kokila', serif;
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            white-space: nowrap;
            line-height: 1;
        }

        /* 6. English Name */
        .overlay-eng-name {
            position: absolute;
            top: 56.30%;
            left: 51.46%;
            transform: translateX(-50%);
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 21px;
            font-weight: 700;
            color: #991b1b; /* Authentic Graphic Era Red */
            white-space: nowrap;
            letter-spacing: 0.5px;
            text-align: center;
            text-transform: uppercase;
        }

        /* 7. English CGPA */
        .overlay-eng-cgpa {
            position: absolute;
            top: 62.05%;
            left: 75.20%;
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: #1a1a1a;
            white-space: nowrap;
            line-height: 1;
        }

        /* ===== PRINT STYLES ===== */
        @media print {
            body {
                background: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .action-bar {
                display: none !important;
            }
            .degree-sheet {
                width: 210mm !important;
                height: 297mm !important;
                box-shadow: none !important;
                page-break-after: always;
                page-break-inside: avoid;
                margin: 0 !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Top Action / Print Bar -->
    <div class="action-bar">
        <div class="action-bar-left">
            <a href="dashboard.html" class="btn-action btn-back">
                <i class="fa fa-arrow-left"></i> Dashboard
            </a>
            <a href="view_results.html" class="btn-action btn-back">
                <i class="fa fa-list"></i> View All Grade Cards
            </a>
            <a href="verify.html?type=degree&id=GE-21538540" id="btnVerifyLink" target="_blank" class="btn-action btn-verify">
                <i class="fa fa-check-circle"></i> Online Verification
            </a>
        </div>
        <div class="action-bar-right">
            <button onclick="window.print()" class="btn-action btn-print">
                <i class="fa fa-print"></i> Print / Download Degree (PDF)
            </button>
        </div>
    </div>

    <!-- Official Degree Sheet (Original Format) -->
    <div class="degree-sheet" id="degreeSheet">
        <!-- 1. Top Meta Overlay Values -->
        <div class="overlay-meta-serial" id="degSerial">2021054084920</div>
        <div class="overlay-meta-enroll" id="degEnroll">GE-21538540</div>
        <div class="overlay-meta-roll" id="degRoll">2187530</div>

        <!-- 2. Official Verification QR Code -->
        <div class="overlay-qr-box" id="degreeQRCode"></div>

        <!-- 3. Candidate Photograph -->
        <div class="overlay-photo-box">
            <img id="degPhoto" src="sohil_photo.png" alt="Candidate Photograph">
        </div>

        <!-- 4. Hindi Candidate Name -->
        <div class="overlay-hindi-name" id="degHindiName">मोहम्मद सोहिल</div>

        <!-- 5. Hindi CGPA -->
        <div class="overlay-hindi-cgpa" id="degHindiCGPA">८.४१</div>

        <!-- 6. English Candidate Name -->
        <div class="overlay-eng-name" id="degName">MOHD SOHIL</div>

        <!-- 7. English CGPA -->
        <div class="overlay-eng-cgpa" id="degCGPA">8.41</div>
    </div>

    <script>
        function initDegreeCertificate() {
            var isSohil = window._isSohil !== false;
            var student = isSohil ? SOHIL_STUDENT : DEFAULT_STUDENT;

            var sName = isSohil ? 'MOHD SOHIL' : (sessionStorage.getItem('userName') || student.name);
            var sHindiName = isSohil ? 'मोहम्मद सोहिल' : 'मोहम्मद हाशिम';
            var sEnroll = isSohil ? 'GE-21538540' : (sessionStorage.getItem('enrollNo') || student.enroll_no);
            var sRoll = isSohil ? '2187530' : (sessionStorage.getItem('classRollNo') || student.class_roll_no);
            var sPhoto = isSohil ? 'sohil_photo.png' : (sessionStorage.getItem('photo') || 'candidate_photo_hd.png?v=20260824');
            var sSerial = isSohil ? '2021054084920' : '2021054074812';
            var sCGPA = isSohil ? '8.41' : '7.68';
            var sHindiCGPA = isSohil ? '८.४१' : '७.६८';

            // Populate DOM Elements
            document.getElementById('degSerial').textContent = sSerial;
            document.getElementById('degEnroll').textContent = sEnroll;
            document.getElementById('degRoll').textContent = sRoll;
            document.getElementById('degHindiName').textContent = sHindiName;
            document.getElementById('degHindiCGPA').textContent = sHindiCGPA;
            document.getElementById('degName').textContent = sName.toUpperCase();
            document.getElementById('degCGPA').textContent = sCGPA;
            document.getElementById('degPhoto').src = sPhoto;

            // Update verification link button
            var btnVerify = document.getElementById('btnVerifyLink');
            if (btnVerify) {
                btnVerify.href = 'verify.html?type=degree&id=' + encodeURIComponent(sEnroll) + '&roll=' + encodeURIComponent(sRoll);
            }

            // Generate Scannable QR Code with Official Certification Text
            try {
                var qrCont = document.getElementById('degreeQRCode');
                qrCont.innerHTML = '';
                var certText = 'This is to certify that ' + sName.toUpperCase() + ' having passed the Examination of the University, securing a CGPA ' + sCGPA + ' on a 10 Point Scale, in the year 2024 has been awarded the Degree of Bachelor of Commerce';

                new QRCode(qrCont, {
                    text: certText,
                    width: 70,
                    height: 70,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch(e) {
                console.error("Degree QR error:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', initDegreeCertificate);
    </script>
</body>
</html>
