<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Authorities Student Management | Results</title>
    <link href="https://student.gehu.ac.in/css/bootstrap/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://student.gehu.ac.in/css/libs/font-awesome.css" rel="stylesheet"/>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,300' rel='stylesheet' type='text/css'>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            padding: 40px 60px;
        }

        /* Hide Netlify Drawer & Badge */
        [data-netlify-drawer], #netlify-badge, .netlify-badge, netlify-drawer, iframe[src*="netlify"], div[class*="netlify-drawer"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Header / Breadcrumb Bar */
        .results-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .breadcrumb-nav {
            font-size: 13px;
        }
        .breadcrumb-nav a {
            color: #0090e3;
            text-decoration: none;
            font-weight: 600;
        }
        .breadcrumb-nav a:hover {
            text-decoration: underline;
        }
        .breadcrumb-nav span {
            color: #94a3b8;
            margin: 0 4px;
        }
        .breadcrumb-nav .current {
            color: #64748b;
        }

        /* Results Table */
        .results-table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13.5px;
        }

        .results-table thead th {
            background-color: #ffffff;
            color: #1f2937;
            font-weight: 700;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            white-space: nowrap;
        }

        .results-table tbody td {
            padding: 13px 16px;
            border: 1px solid #d1d5db;
            color: #374151;
            font-weight: 500;
        }

        .results-table tbody tr:hover {
            background-color: #f9fafb;
        }

        /* View Button */
        .btn-view-result {
            background-color: #28a745;
            color: #ffffff;
            border: none;
            padding: 5px 22px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn-view-result:hover {
            background-color: #218838;
            color: #ffffff;
            text-decoration: none;
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Breadcrumb -->
    <div class="results-header-bar">
        <div class="page-title">Result</div>
        <div class="breadcrumb-nav">
            <a href="dashboard.html">Dashboard</a>
            <span>/</span>
            <span class="current">Result</span>
        </div>
    </div>

    <!-- Results Table -->
    <div class="results-table-container">
        <table class="results-table">
            <thead>
                <tr>
                    <th>StuID</th>
                    <th>Programme</th>
                    <th>Term Type</th>
                    <th>Year Of Exam</th>
                    <th>Grade Card</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                <tr><td colspan="5" style="text-align:center;">Loading results...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadStudentResults() {
            var enrollNo = sessionStorage.getItem('enrollNo') || 'GE-21545586';
            var course = sessionStorage.getItem('course') || 'B.COM Hons';
            var results = await dbGetResults(enrollNo);

            const tbody = document.getElementById('resultsTableBody');

            var semRomans = ['I', 'II', 'III', 'IV', 'V', 'VI'];
            var termTypes = ['ODD', 'EVEN', 'ODD', 'EVEN', 'ODD', 'EVEN'];
            var examYears = ['2020', '2021', '2021', '2022', '2022', '2023'];

            let html = '';
            for (var i = 0; i < 6; i++) {
                var semNum = "" + (i + 1);
                var found = (results || []).find(r => ("" + r.semester) === semNum) || ALL_DEFAULT_RESULTS[i];
                var prog = found ? found.programme : (course + ' ' + semRomans[i]);
                var term = termTypes[i];
                var yr = examYears[i];

                html += `
                    <tr>
                        <td><strong>${enrollNo}</strong></td>
                        <td>${prog}</td>
                        <td>${term}</td>
                        <td>${yr}</td>
                        <td><a href="grade_card.html?sem=${semNum}&id=${enrollNo}" class="btn-view-result" target="_blank">View</a></td>
                    </tr>
                `;
            }

            tbody.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadStudentResults);
    </script>
</body>
</html>
